[package]
name = "baaz-engine"
description = "The BaazCyber Antivirus scanning engine: signatures, heuristics and quarantine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
goblin = { version = "0.9", default-features = false, features = ["std", "pe32", "pe64"] }
regex = "1"
walkdir = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
