name: Rust

# Builds and tests the scanning engine, the CLI and the desktop app on every push and pull request.
# BaazCyber is a Windows app (Tauri + WebView2), so this runs on Windows: on Linux the app would
# need WebKitGTK system libraries it never uses.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --workspace --locked
    - name: Run tests
      run: cargo test --workspace --locked
