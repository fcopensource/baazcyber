name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The app is part of a Cargo workspace, so every crate builds into the top-level target/ folder.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Node dependencies
        run: npm ci

      - name: Build and bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --target x86_64-pc-windows-msvc

      - name: List bundle output
        shell: bash
        run: find ../target/x86_64-pc-windows-msvc/release/bundle -type f

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      # GitHub replaces spaces in release file names with dots, so rename first and the manifest URL matches.
      - name: Name files the way GitHub will
        run: |
          find dist -type f -name "* *" | while read -r f; do mv "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '.')"; done
          find dist -type f

      - name: Create updater manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NSIS=$(find dist -name "*-setup.exe" | head -1)
          if [ -z "$NSIS" ] || [ ! -f "$NSIS.sig" ]; then
            echo "::error::The NSIS installer or its updater signature is missing. Check TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          SIGNATURE=$(cat "$NSIS.sig")
          REPO="${{ github.repository }}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME for what's new." \
            --arg date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg url "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$(basename "$NSIS")" \
            --arg sig "$SIGNATURE" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {url: $url, signature: $sig}}}' \
            > dist/latest.json
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.sig
            dist/latest.json
