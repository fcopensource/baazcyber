[workspace]
members = ["crates/baaz-engine", "crates/baaz-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["BaazCyber, a FlightCoders company"]

[profile.release]
# Thin LTO and several codegen units keep peak memory low enough for an 8-16 GB machine.
lto = "thin"
codegen-units = 16
opt-level = 2
strip = true
