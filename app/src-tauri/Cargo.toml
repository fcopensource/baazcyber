[package]
name = "baazcyber"
version = "0.1.0"
edition = "2021"
description = "BaazCyber Antivirus"
authors = ["BaazCyber, a FlightCoders company"]
license = "Proprietary"

[lib]
name = "baazcyber_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
baaz-engine = { path = "../../crates/baaz-engine" }

